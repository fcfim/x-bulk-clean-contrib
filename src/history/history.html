<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job History · Postscrub</title>
  <style>
    :root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--muted:#6c6c67;--faint:#989893;--border:rgba(27,27,25,.11);--green:#16854a;--green-bg:#edf7f1;--red:#c73d37;--red-bg:#fdf2f1;--amber:#9a6814;--amber-bg:#fff7e8;--radius:14px;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .shell{width:min(960px,calc(100% - 32px));margin:0 auto;padding:28px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:50%;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}.brand strong{display:block;font-size:15px}.brand span{display:block;color:var(--faint);font-size:11px}.repo{color:var(--muted);font-size:12px;font-weight:650;text-decoration:none}.repo:hover{text-decoration:underline;text-underline-offset:3px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.hero h1{margin:0 0 5px;font-size:30px;letter-spacing:-.04em;text-wrap:balance}.hero p{margin:0;color:var(--muted);font-size:14px;text-wrap:pretty}.totals{display:flex;gap:8px}.total{min-width:90px;padding:10px 12px;border-radius:11px;background:var(--card);box-shadow:inset 0 0 0 1px var(--border)}.total strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}.total span{color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px}.search{position:relative;min-width:0;flex:1}.search .icon{position:absolute;left:12px;top:50%;width:16px;height:16px;color:var(--faint);transform:translateY(-50%)}.search input{width:100%;height:42px;padding:0 13px 0 38px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);outline:none}.search input:focus{border-color:rgba(40,120,200,.35);box-shadow:0 0 0 3px rgba(40,120,200,.12)}.toolbar-actions{display:flex;gap:7px}.clear-button,.download-all{height:42px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}.clear-button{border:1px solid rgba(199,61,55,.16);background:var(--red-bg);color:var(--red)}.download-all{border:1px solid rgba(22,133,74,.16);background:var(--green-bg);color:var(--green)}.clear-button:disabled,.download-all:disabled{opacity:.45;cursor:not-allowed}.clear-button:active:not(:disabled),.download-all:active:not(:disabled){transform:scale(.97)}
    .history-list{display:grid;gap:9px}.job{border-radius:var(--radius);background:var(--card);box-shadow:0 1px 2px rgba(15,15,15,.03),inset 0 0 0 1px var(--border);overflow:hidden}.job summary{min-height:72px;padding:12px 14px;display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer}.job summary::-webkit-details-marker{display:none}.job summary:focus-visible{outline:3px solid rgba(40,120,200,.14);outline-offset:-3px}.job-icon{width:38px;height:38px;display:grid;place-items:center;flex:0 0 38px;border-radius:10px;background:#f1f1ef;color:var(--muted)}.job-icon .icon{width:17px;height:17px}.job-main{min-width:0;flex:1}.job-title{display:block;font-size:13px;font-weight:730}.job-meta{display:block;margin-top:2px;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}.job-count{min-width:56px;text-align:right}.job-count strong{display:block;font-size:15px;font-variant-numeric:tabular-nums}.job-count span{color:var(--faint);font-size:9px;text-transform:uppercase}.status{padding:4px 7px;border-radius:999px;font-size:9px;font-weight:750;text-transform:capitalize}.status.completed{background:var(--green-bg);color:var(--green)}.status.stopped,.status.rate_limited{background:var(--amber-bg);color:var(--amber)}.status.interrupted{background:var(--red-bg);color:var(--red)}.chevron{color:var(--faint);transition:transform 160ms var(--ease)}.job[open] .chevron{transform:rotate(180deg)}
    .job-detail{padding:0 14px 14px;border-top:1px solid var(--border)}.job-facts{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0}.fact{padding:6px 8px;border-radius:8px;background:var(--bg);color:var(--muted);font-size:10.5px}.fact strong{color:var(--ink)}.job-actions{display:flex;gap:7px;margin-left:auto}.job-actions button{min-height:34px;padding:0 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer}.job-actions .delete{border-color:rgba(199,61,55,.14);color:var(--red)}.job-actions button:active{transform:scale(.97)}.job-actions .icon{width:14px;height:14px}
    .records{border:1px solid var(--border);border-radius:10px;overflow:hidden}.record-head,.record{display:grid;grid-template-columns:110px 135px minmax(0,1fr) 120px;gap:10px;align-items:center}.record-head{padding:7px 10px;background:var(--bg);color:var(--faint);font-size:9px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.record{padding:9px 10px;border-top:1px solid var(--border);font-size:10.5px}.record:first-of-type{border-top:0}.record-type{font-weight:700}.record-date,.record-person{overflow:hidden;color:var(--muted);text-overflow:ellipsis;white-space:nowrap}.record-content{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-content a{color:inherit;text-decoration:none}.record-content a:hover{text-decoration:underline}.empty-records{padding:18px;color:var(--faint);font-size:11px;text-align:center}.empty{padding:52px 20px;border-radius:var(--radius);background:var(--card);box-shadow:inset 0 0 0 1px var(--border);text-align:center}.empty img{width:82px;height:82px;border-radius:50%;opacity:.8}.empty h2{margin:13px 0 4px;font-size:16px}.empty p{margin:0;color:var(--muted);font-size:12px}
    dialog{width:min(390px,calc(100% - 32px));padding:0;border:0;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,20,18,.5)}.dialog-body{padding:19px}.dialog-body h2{margin:0 0 5px;font-size:17px}.dialog-body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.dialog-actions button{min-height:40px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}.cancel{border:1px solid var(--border);background:#fff;color:var(--muted)}.danger{border:0;background:var(--red);color:#fff}
    .repo,.clear-button,.download-all,.job summary,.job-actions button,.fact,.record,.total{transition:transform 150ms var(--ease),background-color 160ms ease,color 160ms ease,border-color 160ms ease,box-shadow 160ms ease}.repo{min-height:40px;padding:0 10px;align-items:center;border-radius:9px}.job{transition:transform 180ms var(--ease),box-shadow 180ms ease}.job summary{transition:background-color 160ms ease}.job summary:active{transform:scale(.995)}.job[open]{box-shadow:0 10px 26px rgba(15,15,15,.055),inset 0 0 0 1px rgba(27,27,25,.12)}.job[open] summary{background:#fcfcfb}.job-detail{opacity:1;transform:translateY(0);transition:opacity 200ms var(--ease),transform 200ms var(--ease)}.job[open] .job-detail{@starting-style{opacity:0;transform:translateY(-5px)}}.job[data-action="delete"] .job-icon{background:var(--red-bg);color:var(--red)}.job[data-action="bulkUnfollow"] .job-icon{background:var(--amber-bg);color:var(--amber)}.job[data-action="unlike"] .job-icon{background:#eef6fd;color:#2878c8}.records{box-shadow:0 1px 2px rgba(15,15,15,.025)}.record{transition:background-color 140ms ease}.job-actions button:active,.clear-button:active:not(:disabled),.download-all:active:not(:disabled){transform:scale(.97)}@media(hover:hover) and (pointer:fine){.repo:hover{background:var(--card);color:var(--ink);text-decoration:none}.download-all:hover:not(:disabled){border-color:rgba(22,133,74,.28);background:#e4f4eb}.job:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(15,15,15,.045),inset 0 0 0 1px var(--border)}.job summary:hover{background:#fcfcfb}.record:hover{background:#fcfcfb}.job-actions button:hover{border-color:rgba(27,27,25,.2);background:#fcfcfb}.job-actions .delete:hover{background:var(--red-bg);border-color:rgba(199,61,55,.2)}}
    dialog{opacity:1;transform:scale(1) translateY(0);transition:opacity 200ms var(--ease),transform 200ms var(--ease),display 200ms allow-discrete,overlay 200ms allow-discrete}@starting-style{dialog{opacity:0;transform:scale(.96) translateY(6px)}}dialog::backdrop{opacity:1;transition:opacity 180ms ease,display 180ms allow-discrete,overlay 180ms allow-discrete}@starting-style{dialog::backdrop{opacity:0}}.dialog-actions button{transition:transform 150ms var(--ease),background-color 160ms ease}.dialog-actions button:active{transform:scale(.97)}
    @media(max-width:680px){.hero{align-items:flex-start;flex-direction:column}.totals{width:100%}.total{flex:1}.record-head{display:none}.record{grid-template-columns:1fr}.record-date,.record-person{white-space:normal}.job summary{gap:9px}.status{display:none}.toolbar{align-items:stretch;flex-direction:column}.toolbar-actions{display:grid;grid-template-columns:1fr 1fr}.clear-button,.download-all{justify-content:center}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}.job,.job-detail,dialog{transform:none!important;transition-property:opacity,background-color,color!important;transition-duration:100ms!important}}
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  </svg>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><img class="logo" src="../icons/logo.png" alt=""><div><strong>Postscrub</strong><span>Local cleanup history</span></div></div>
    </header>
    <main>
      <section class="hero"><div><h1>Job history</h1><p>Review every cleanup run and the records affected on each X account.</p></div><div class="totals"><div class="total"><strong id="totalJobs">0</strong><span>Jobs</span></div><div class="total"><strong id="totalRecords">0</strong><span>Records</span></div></div></section>
      <div class="toolbar"><label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="historySearch" type="search" placeholder="Search action, account, or status…" aria-label="Search job history"></label><div class="toolbar-actions"><button id="downloadAll" class="download-all" type="button"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Download all CSV</button><button id="clearAll" class="clear-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Clear all history</button></div></div>
      <section id="historyList" class="history-list"></section>
      <section id="emptyState" class="empty" hidden><img src="../icons/logo.png" alt=""><h2>No job history yet</h2><p>Completed and stopped cleanup jobs will appear here.</p></section>
    </main>
  </div>
  <dialog id="deleteDialog" aria-labelledby="dialogTitle"><div class="dialog-body"><h2 id="dialogTitle">Remove this history?</h2><p id="dialogText">The saved job details and CSV backup will be removed from this browser.</p><div class="dialog-actions"><button id="dialogCancel" class="cancel" type="button">Cancel</button><button id="dialogConfirm" class="danger" type="button">Remove</button></div></div></dialog>
  <script src="history.js"></script>
</body>
</html>
