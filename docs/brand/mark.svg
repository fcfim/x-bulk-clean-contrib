<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Postscrub</title>
  <!-- Postscrub mark. A post card whose lower-right corner has been swept away (r64 vs r24).
       Top bar: content kept. Second line: a kept fragment (white) and a fragment selected for removal (amber),
       its end swept along the same arc. Every straight edge sits on the 8-unit grid (whole pixels at 16/32/48). -->
